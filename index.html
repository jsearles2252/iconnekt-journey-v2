<script>
const INFO={root:{tag:"iConnekt · AmSuisse",c:"#2a2820",title:"iConnekt Agent Platform",desc:"The agent operating hub for AmSuisse-enabled carrier access, quoting, brokerage submission, production visibility, and agency management. One intake, one quote record, multiple placement paths.",items:["Single sign-on for all carrier access and quoting","Direct Appointment / API Quote lane","Direct Appointment / Portal Quote lane","AmSuisse Brokerage Submission lane","Carrier appointments, onboarding, and compliance","Commission and production tracking"]},onboarding:{tag:"Phase 1 · Onboarding",c:"#2a4018",title:"Onboarding & setup",desc:"Guided setup building the universal agency profile. Powers carrier appointment requests, ACORD pre-fill, compliance tracking, and the universal question bank.",items:["Create login, verify email, set MFA, accept terms, select or create agency","Agency basics: name, DBA, FEIN, NPN, resident state, addresses, phone, website","Principal/owner info: name, title, email, NPN, license, background questions","Producer setup: NPN, states licensed, lines licensed, role, quote authority","Licenses: agency and producer licenses, states, expirations, uploads","E&O: carrier, policy number, limits, deductible, effective/expiration, certificate upload","Documents: W-9, E&O certificate, licenses, ACH, agency agreement","Business profile: annual P&C premium, commercial/personal mix, target industries, current carriers","Compliance questions: bankruptcy, disciplinary history, license suspensions, E&O claims","Initial carrier appointment selection — question bank fills remaining carrier-specific questions"]},login:{tag:"Phase 1",c:"#2a4018",title:"Login / SSO",desc:"Agent creates account or signs in. MFA required. Multi-agency users select active agency from a switcher.",items:["Login and forgot password flow","MFA setup — required for all users","Agency selection switcher for multi-agency users","Role-based access applied on login","Session timeout and device/IP logging"]},onboard:{tag:"Phase 1",c:"#2a4018",title:"Agency onboarding",desc:"Universal agency profile built once, used everywhere.",items:["Agency profile: FEIN, NPN, entity type, resident state, addresses, phone, website, years in business","Principal and owner info with compliance background questions","Producer setup with NPN, license numbers, states, lines of authority, role, commission visibility","License uploads with state, line, issue/expiration dates, validation status, renewal alerts","E&O: carrier, policy number, limits, deductible, effective/expiration, named insured, covered entities, certificate upload","Documents: W-9, ACH, agency agreement, carrier-specific docs","Compliance questions: bankruptcy, disciplinary history, license suspensions, E&O claims, carrier terminations, regulatory actions"]},home:{tag:"Phase 1",c:"#2a4018",title:"Home dashboard",desc:"Daily command center. What can I quote today, what appointments are pending, what needs action, what compliance item could block me?",items:["Quick actions: Start Quote, Request Appointment, Submit to Brokerage, Add Account, Invite Agent, Upload License/E&O","Active quotes pipeline: draft, submitted, needs info, quoted, bind-ready, bound, declined, expired","Pending appointment requests with carrier, status, missing items, next step","Brokerage items needing agent response: quotes returned, info requests, bind requests","Commission snapshot: month estimate, received, paid, pending, chargebacks, discrepancies","Compliance snapshot: E&O, licenses, state appointments, W-9/payment info, expiring documents","Alert banner: new carrier, appetite change, state expansion, carrier outage, compliance reminder, sales campaign"]},admin:{tag:"Platform",c:"#2a4018",title:"Agency Admin",desc:"Setup and controls — users, roles, integrations, billing, and compliance.",items:["Agency profile: legal name, DBA, FEIN, NPN, resident state, addresses, ownership, lines, states, annual premium","Users and permissions: invite, deactivate, roles, producers, branches, quote access, commission visibility, admin rights","Licenses: agency and producer licenses, state appointments, expiration dates, uploads, renewal reminders","E&O: carrier, policy number, limits, deductible, effective/expiration, covered entities/producers, certificate, expiration alerts","Documents: W-9, E&O, licenses, agency agreements, carrier appointment forms, ACH, signed agreements","Integrations: Salesforce, EPIC, carrier APIs, portal credentials, document signing, payments, email, webhook logs","Settings: notification preferences, branding, producer code mapping, child agency inheritance, billing/subscription"]},roles:{tag:"Platform",c:"#2a4018",title:"Roles & permissions",desc:"9 roles with data scopes. Simple roles plus data scopes make parent/child agency structures flexible.",items:["Platform Super Admin: full control across all agencies, audit logs, support impersonation with logging","Market/Appointment Admin: carrier setup, appointment requests, carrier docs, appetite, carrier communications","Brokerage Team: internal brokerage users — submissions, market responses, quote returns, bind requests","Agency Owner: full agency control — profile, users, quotes, appointments, commissions, E&O, integrations","Agency Admin/Operations Manager: daily operations, users, licenses/E&O, appointments, quotes, reports","Producer/Agent: start quotes, submit business, view assigned accounts, request appointments if allowed","CSR/Account Manager: accounts, quotes, docs, renewals, endorsements, tasks — commission visibility optional","Finance/Accounting: commissions, statements, exports, production reports — no quote/admin rights unless granted","Read-only/Auditor: view-only assigned data"]},"parent-child":{tag:"Platform",c:"#2a4018",title:"Parent/child agency structure",desc:"Data scopes control what child agencies can see and inherit from parent agencies.",items:["Data scopes: entire platform, entire agency, parent agency, child agency, branch/location, team, individual producer, assigned accounts only","Inheritance settings: no inheritance, view-only, appointment inheritance, document inheritance, commission roll-up, full operational inheritance","Key decision: can child agencies use parent AmSuisse appointments, documents, commission structures, and carrier access?","Separate agency-level vs producer-level credentials and appointments tracked independently"]},notifications:{tag:"Platform",c:"#2a4018",title:"Notifications & tasks",desc:"Notification types, task structure, and universal search keep the agent operating efficiently.",items:["Appointment: approved, needs info, carrier declined, suspended, new market available","Quote: returned, needs info, expiring, policy bound, document missing","Compliance: license expiring, E&O expiring, W-9/payment info needed, statement received","Commission: statement received, discrepancy flagged, chargeback posted","System: carrier outage, appetite update, sales campaign, new carrier available","Task structure: owner, due date, priority, related account/carrier/quote/appointment, status, comments, attachments","Universal search: carrier, account, insured, policy, quote, producer, appointment, document, commission, task, state, product, class"]},appointments:{tag:"Phase 2 · Carrier Appointments",c:"#1a3c38",title:"Carrier Appointments",desc:"The agent's complete market library — direct appointment carriers, requests, status tracking, brokerage markets, appetite guide, and carrier documents.",items:["My Direct Appointments: ~45 direct access appointment carriers with status and quote method badge","Request Appointment: full eligibility check flow — missing items only","Appointment Status: full lifecycle with timeline, owner, missing items, next action","Brokerage Markets: ~40-45 brokerage-side carriers or market categories","Appetite Guide: searchable by product, state, class, industry, carrier, API/portal availability","Carrier Documents: marketing PDFs, appetite guides, underwriting guides, supplemental forms, portal instructions","Language rule: Request Carrier Appointment (direct) vs Submit Risk to Brokerage (brokerage markets)"]},"carrier-appts":{tag:"Phase 2",c:"#1a3c38",title:"My direct appointments",desc:"All ~45 direct appointment carriers through AmSuisse, showing appointment status and quote method.",items:["Carrier card badges: Direct Appointment, API Connected, Portal Quote, AmSuisse Brokerage","Appointment statuses: Appointed, Appointment Available, Requested, Pending, Needs Info, Declined, Suspended, Coming Soon, Not Available","Carrier card shows: logo, products available, states available, quote method, appointment status, last updated, carrier alert badge","Actions on card: Start Quote, Open Portal, Request Appointment, Appetite Guide, Documents, Carrier Contact","Commission summary visible if role allows"]},"appt-request":{tag:"Phase 2",c:"#1a3c38",title:"Request carrier appointment",desc:"System pre-checks completeness before showing any form. Only missing items are surfaced.",items:["Step 1: system checks agency profile, producer profile, E&O, licenses, state availability, carrier requirements","Step 2: if complete — user reviews and submits","Step 3: if incomplete — system shows only missing fields/documents (not full form)","Step 4: if not eligible — system explains specific reason: state, license, appointment rule, product restriction, E&O, or carrier capacity","Appointment status tracker: Requested → Pending → Approved / Needs Info / Declined / Suspended"]},"appt-status":{tag:"Phase 2",c:"#1a3c38",title:"Appointment status tracking",desc:"Full lifecycle tracking for every carrier appointment request.",items:["Statuses: Available, Requested, Pending, Needs Info, Approved/Appointed, Declined, Suspended, Expired, Not Available","Status drawer: full timeline, who owns it, missing items, next action button","Notifications: approved, needs info, carrier declined, info request from carrier","Declined: specific reason shown with alternative carriers suggested"]},"brokerage-mkt":{tag:"Phase 2",c:"#1a3c38",title:"Brokerage market library",desc:"~40-45 brokerage-side markets available through AmSuisse brokerage submission. Not direct appointment access.",items:["Named carrier logos or market categories: E&S, coastal, workers comp, excess, habitational, cannabis, liquor","Access via: Submit Risk or Submit to Brokerage — NOT Request Appointment","Carrier appetite by product, state, class, risk type","Turnaround time estimates shown per market"]},"appetite-guide":{tag:"Phase 2",c:"#1a3c38",title:"Appetite guide",desc:"Searchable market guide covering all direct and brokerage carriers.",items:["Search by: product, state, class, industry, carrier, direct/brokerage, API availability, portal availability","Results show: carrier, route (direct/brokerage), states, products, key appetite notes","Filters: direct appointment only, API-connected only, brokerage only, available now","Updates when carrier appetite changes — alert badge shown on carrier card"]},quoting:{tag:"Phases 3–5 · Quote & Place",c:"#5a3c08",title:"Quote & Place",desc:"The main workbench. One intake, one quote record, multiple placement paths.",items:["Primary actions: Start Quote, Resume Quote, Submit to Brokerage, Open Portal Workspace, View Saved Quotes","Quote filters: My Quotes, Agency Quotes, Drafts, Submitted, Needs Info, Quoted, Bind Ready, Bound, Lost, Expired","Quote Workspace sections: Overview, Intake, Markets, Documents, Compare, Activity","Quote statuses: Draft → Intake Started → Market Matched → API Running → Portal In Progress → Brokerage Package Incomplete → Submitted to Brokerage → Out to Market → Quoted → Bind Ready → Bind Requested → Bound → Declined → Expired → Lost → Closed"]},"start-quote":{tag:"Phase 3",c:"#5a3c08",title:"Start quote",desc:"First screen collects only routing-critical data. Carrier-specific questions appear only when that carrier is selected.",items:["Screen 1 — routing data only: business/personal, product line, state, effective date, industry/class, risk location, new/renewal","Screen 2 — account basics: named insured, DBA, entity type, FEIN, mailing and risk addresses, contact, phone, email, website, years in business","Screen 3 — product-specific data added only after product is known","Carrier-specific questions appear only when that carrier is selected AND the answer is not already known from onboarding"]},intake:{tag:"Phase 3",c:"#5a3c08",title:"Common intake",desc:"Risk data entered once, shared across all three quote lanes. Universal question bank avoids re-entry.",items:["Named insured, DBA, entity type, FEIN, mailing and risk addresses, contact, phone, email, website, years in business","Operations description, revenue, payroll, prior carrier, current premium, loss history, effective date, requested coverages","Product-specific: GL class, property values, construction, occupancy, payroll by class, liquor receipts, cannabis operations, coastal location data, professional services, umbrella limits","Universal question bank: every question tagged by carrier, product, state, agency vs producer, reusable answer, expiration","Already answered globally = do not ask again unless expired or carrier requires a different answer"]},"market-match":{tag:"Phase 3 · Core Screen",c:"#5a3c08",title:"Market Match ✦",desc:"The signature screen. Routes the risk to all possible markets. Every blocked market shows the specific reason and recovery action.",items:["Direct Appointment / API — eligible API carriers with Run Quote buttons — shown FIRST","Direct Appointment / Portal — appointed non-API carriers with Open Portal Workspace buttons","AmSuisse Brokerage — market categories or named carriers with Build Package or Submit buttons","Unavailable/blocked — every carrier shows specific reason plus recovery action","Recommended path — iConnekt highlights fastest quote, best appetite fit, or brokerage recommended"]},"quote-strategy":{tag:"Phase 3 · Routing",c:"#5a3c08",title:"Quote strategy step",desc:"After intake, system recommends best placement path. Brokerage is NEVER automatic.",items:["Direct Recommended: fast, clean risk that fits direct appointment markets","Direct First / Brokerage If Needed: DEFAULT for most risks","Brokerage Recommended: complex, declined by direct, or coverage gap scenarios","Brokerage Required: E&S, cannabis, coastal, high-risk class, manual review needed","No Market Found: risk does not match any current market"]},"api-lane":{tag:"Phase 4 · Direct API",c:"#5a3c08",title:"Direct API quote lane",desc:"Used when agency has AmSuisse direct appointment AND carrier is API-connected.",items:["Run Quote: sends selected Market Attempt to carrier API","Quote All Eligible: sends intake to all selected eligible API carriers simultaneously","Complete & Run Quote: opens only missing fields required by that carrier","Bind Now / Request Bind: API bind if supported by carrier, otherwise creates bind workflow","API attempt statuses: Eligible, Missing Info, Running Quote, Quoted, Declined, Referral Required, API Error, Expired, Bind Ready, Bind Requested, Bound"]},"api-error":{tag:"Phase 4 · Blocked",c:"#5a3c08",title:"API decline or error",desc:"System always shows cause and specific recovery options. Never just an error code.",items:["Decline: show reason if available, offer portal fallback or brokerage escalation","Referral Required: route to manual review or brokerage submission","API Error: show field/eligibility issue, offer Retry, View Field Issue, Open Portal Workspace if available, Escalate to Brokerage","Missing Info: show exactly which fields are needed — Complete & Run Quote button shows only those fields"]},"portal-lane":{tag:"Phase 4 · Portal Quote",c:"#5a3c08",title:"Portal workspace",desc:"Used when agency has direct appointment but carrier is not API-enabled. Agent quotes without leaving iConnekt workflow.",items:["Left panel: Quote Packet — insured, risk data, coverage selections, loss history, prior carrier, documents, copy buttons","Center panel: carrier portal session (embedded webview, controlled browser session, or secure pop-out)","Right panel: activity, documents, notes, premium fields, quote number, limits, deductible, subjectivities, status controls","Portal quote becomes same structured Quote Result object as API quote — source different, comparison unified","Portal attempt statuses: Not Started, Portal Opened, In Progress, Submitted in Carrier Portal, Quote Returned, Quote Uploaded, Declined, Needs Info, Bind Requested, Bound"]},"portal-upload":{tag:"Phase 4 · Portal",c:"#5a3c08",title:"Upload & save portal quote",desc:"After quoting in the carrier portal, agent captures the result inside iConnekt.",items:["Copy Risk Info: copies structured data for manual entry into carrier portal","Upload Quote: attach quote PDF or proposal document","Save Quote Details: capture premium, limits, deductible, fees, quote number, expiration date, subjectivities","Add to Comparison: publishes portal quote into same comparison table as API quotes — source label: Direct Portal"]},"broker-lane":{tag:"Phase 4 · Brokerage",c:"#5a3c08",title:"AmSuisse brokerage submission",desc:"Same quote intake generates the brokerage-ready package. Direct-First rule always applies.",items:["Triggered by: risk complexity, direct decline/error, coverage gap, outside direct appetite, manual agent choice","Direct-First rule: if direct markets exist, system warns and offers Quote Direct First / Submit to Brokerage Anyway","Brokerage justification required if direct options exist: Direct quote declined, Not competitive, Coverage not available direct, Higher limits needed, Risk complexity, Carrier referral required","Escalate to Brokerage: available at any point after running direct quotes"]},"pkg-build":{tag:"Phase 4 · Package",c:"#5a3c08",title:"Build brokerage package",desc:"iConnekt pre-fills ACORDs from intake data. Package completeness % guides what's needed.",items:["Generate ACORDs from intake data wherever possible","Required uploads: loss runs (prior 3 years), current declarations page, supplemental forms, schedules, photos, statements of values","Narrative fields: operations description, target premium, current carrier, prior claims, desired limits, special circumstances, underwriter notes","Package completeness % shown with named missing items","Submit button unlocks when required minimum package is complete"]},"broker-submit":{tag:"Phase 4 · Brokerage",c:"#5a3c08",title:"Submit to brokerage",desc:"Package sent to AmSuisse brokerage queue. Capacity controls protect the brokerage team.",items:["Capacity controls: direct markets available? risk eligible? required docs attached? submission complete? duplicate check? sufficient premium?","Estimated turnaround: Same day, 1-2 business days, 2-5 business days, Depends on market response","Brokerage case statuses: Draft, Package Incomplete, Ready to Submit, Submitted, Broker Assigned, More Info Needed, Out to Market, Indication Received, Quote Received, Presented to Agent, Bind Requested, Bound, Declined, Lost, Closed"]},compare:{tag:"Phase 5",c:"#5a3c08",title:"Quote comparison",desc:"All quote results — API, portal, and brokerage — in one table. Source-agnostic comparison view.",items:["Columns: carrier/market, source route, appointment status, premium, fees, limits, deductible, commission, subjectivities, expiration date, bind action, notes","Source labels: Direct API · Direct Portal · AmSuisse Brokerage","Actions: Generate Proposal, Request Client Approval, Mark Lost, Request Bind, Export PDF, Push to EPIC, Update Salesforce","All three source types comparable side by side in the same table"]},escalate:{tag:"Phase 5 · Escalation",c:"#5a3c08",title:"Escalate to brokerage",desc:"After running direct quotes, agent decides results aren't sufficient. Packages everything — no starting over.",items:["Triggered: agent ran direct quotes, results insufficient due to pricing, limits, or coverage gaps","Packages: existing intake, API/portal results, decline reasons, coverage gaps, why brokerage is being requested","Agent selects escalation reason from standard list","Brokerage team receives full context — no need to re-explain"]},bind:{tag:"Phase 5",c:"#5a3c08",title:"Request bind",desc:"Agent selects a quote and initiates bind. Path depends on the source lane.",items:["API bind: Bind Now / Request Bind — uses API bind if supported, otherwise creates bind workflow","Portal bind: instructions shown to agent to complete bind in carrier portal","Brokerage bind: Request Brokerage Bind sent to AmSuisse brokerage desk for processing","Bind request creates policy record, triggers document flow, commission record creation, EPIC sync, Salesforce update"]},postbind:{tag:"Phase 6 · Post-bind",c:"#4a2820",title:"Post-bind & book of business",desc:"Policy issued, commissions tracked, activity logged, data synced to EPIC and Salesforce in Phase 2.",items:["Policy record: number, carrier, product, effective/expiration, premium, commission, status, documents, claims link","Commission record created at bind: Estimated → Pending → Received → Paid","Activity log: full timeline from created through API sent, portal opened, brokerage submitted, broker assigned, quote returned, bind requested, bound, synced","EPIC sync status and Salesforce sync status visible on each policy record"]},"accounts-policies":{tag:"Phase 6",c:"#4a2820",title:"Accounts & policies",desc:"Book of business view. Usable agent workspace even before EPIC integration is live.",items:["Accounts: named insured, contact, producer, CSR, policies, open quotes, tasks, renewal dates, notes, documents, activity timeline","Policies: policy number, carrier, product, effective/expiration, premium, commission, status, documents, claims link, endorsement request, renewal workflow","Renewals: 90/60/30-day views, expired, non-renewed, remarket recommended, retained/lost, renewal quote status"]},commissions:{tag:"Phase 6",c:"#4a2820",title:"Commission tracking",desc:"Commission moves Estimated → Received → Paid. Visibility controlled by role.",items:["Statuses: Estimated, Pending, Received, Paid, Short Paid, Chargeback, Disputed, Reconciled","Production views: by producer, agency, child agency, branch, carrier, product, state, month/quarter/year, new business, renewal, bound premium, submitted premium, quote-to-bind ratio","Commission visibility rules: producer sees own only by default; manager sees team; owner sees all"]},renewal:{tag:"Phase 6",c:"#4a2820",title:"Renewal queue",desc:"90/60/30-day views of upcoming renewals. Start renewal quote directly from queue.",items:["90, 60, 30-day renewal views with policy details","Expired and non-renewed filters","Remarket recommended flag based on carrier/appetite changes","Renewal quote status: quoted, bind-ready, bound, lost"]},"epic-sf":{tag:"Phase 2 · Integration",c:"#4a2820",title:"EPIC / Salesforce sync",desc:"Phase 2. iConnekt pushes bound policy data to EPIC and syncs Salesforce. iConnekt is NOT replacing EPIC.",items:["EPIC feeds iConnekt: accounts, policies, premium, effective/expiration, producer assignment, commissions, production numbers, renewals","iConnekt sends to EPIC: new account, submission, bound policy, documents, activity notes, producer info, Salesforce IDs","Salesforce objects synced: agency, contact, user/producer, appointment request, quote/submission summary, bound policy summary, task/status, production milestone","Source-of-truth rules: iConnekt owns onboarding, appointment workflow, quote operations; EPIC owns accounts, policies, production, commissions"]},brokerage:{tag:"Internal · Brokerage Desk",c:"#302860",title:"Brokerage desk",desc:"Visible only to AmSuisse brokerage users. Full lifecycle from submission intake through market placement, quote return, and bind.",items:["Queues: New Submissions, Incomplete, Assigned to Me, More Info Needed, Out to Market, Quotes Received, Bind Requests, Closed/Lost","Case record: agency, producer, insured, product, state, effective date, risk summary, documents, generated ACORDs, notes, markets approached, carrier responses, quote options","Internal buttons: Assign Broker, Request More Info, Mark Package Complete, Send to Market, Add Market Response, Upload Quote, Send Quote to Agent, Request Bind, Mark Bound, Close Submission"]},"broker-queue":{tag:"Brokerage Desk",c:"#302860",title:"Submissions queue",desc:"All agent brokerage submissions land here. Filtered by status and assignee.",items:["Filters: New, Incomplete, Assigned to Me, More Info Needed, Out to Market, Quotes Received, Bind Requests, Closed/Lost","Broker can claim, assign, or escalate cases","Duplicate detection and minimum submission quality checks applied on arrival"]},"broker-assign":{tag:"Brokerage Desk",c:"#302860",title:"Assign broker",desc:"Internal owner assigned to submission. Agent sees broker name from quote record.",items:["Assign Broker: assigns internal case owner","Agent notification: broker has been assigned to your submission","Broker can reassign or escalate to senior broker"]},"broker-market":{tag:"Brokerage Desk",c:"#302860",title:"Send to market",desc:"Broker selects target carrier markets and sends package. All responses logged.",items:["Broker selects from brokerage market library (~40-45 markets)","Indication Received / Quote Received statuses update as carrier responses arrive","Multiple markets can be worked simultaneously in one case record"]},"broker-info":{tag:"Brokerage Desk",c:"#302860",title:"More info needed",desc:"Broker requests additional information from agent. Creates agent-facing task.",items:["Request More Info: creates task visible to agent in their quote record","Agent notification: your broker needs more information — with specific items listed","Info request and response tracked in case timeline"]},"broker-return":{tag:"Brokerage Desk",c:"#302860",title:"Return quote to agent",desc:"Broker sends market quote result to agent. Appears in agent's Quote Comparison view.",items:["Send Quote to Agent: pushes structured quote result into agent's comparison table","Source label in comparison: AmSuisse Brokerage","Broker can present multiple market options in one return"]},"broker-bind":{tag:"Brokerage Desk",c:"#302860",title:"Brokerage bind",desc:"Agent requests bind on brokerage quote. AmSuisse team handles bind with carrier and updates record.",items:["Agent clicks Request Brokerage Bind in comparison view","Broker handles bind process with carrier — agent does not need to act","Mark Bound updates policy record, triggers commission record creation, document flow, notifications"]},blocked:{tag:"Blocked Paths",c:"#501c0c",title:"Blocked paths & recovery",desc:"Every blocked state in iConnekt shows the specific reason and the exact recovery action. Never a generic error message.",items:["E&O expired → upload current certificate in Agency Admin → auto-unblocks when validated","Missing license → add state/line license in Agency Admin → unblocks appointments and quoting","Outside carrier appetite → use Appetite Guide to find matching carrier, or Submit to Brokerage for E&S access","Not appointed → Request Carrier Appointment (direct side) or Submit Risk to Brokerage (brokerage side)","Incomplete brokerage package → named missing items shown, upload to unblock Submit button","API error/decline → Retry, View Field Issue, Open Portal Workspace if available, or Escalate to Brokerage","Portal credentials expired → refresh in Agency Admin → Integrations → Portal Credentials","Compliance block (W-9, ACH, background question) → specific item shown with resolution path"]},"block-eo":{tag:"Blocked · E&O",c:"#501c0c",title:"E&O expired or missing",desc:"E&O certificate expired or missing. Blocks carrier appointment requests and may block quoting.",items:["Recovery: upload current E&O certificate in Agency Admin → Documents","Validation: system checks carrier name, policy number, limits, deductible, effective/expiration dates, named insured match","Auto-unblocks: once uploaded and validated, blocked appointment requests become available automatically"]},"block-license":{tag:"Blocked · License",c:"#501c0c",title:"Missing license",desc:"Agency or producer missing a license for the required state or line of business.",items:["Recovery: Agency Admin → Licenses → Add license with state, line, expiration date, and upload document","NIPR validation planned for a future phase to auto-verify license status","Renewal reminders based on expiration dates stored in system"]},"block-appetite":{tag:"Blocked · Appetite",c:"#501c0c",title:"Outside carrier appetite",desc:"Risk class, state, limits, or property characteristics outside this carrier's appetite.",items:["Specific reasons shown: class not written, state not available, coastal exclusion, claims history, occupancy type, cannabis, liquor, construction type, habitational","Recovery option 1: use Appetite Guide to find carriers that DO write this risk","Recovery option 2: Submit to AmSuisse Brokerage for E&S/hard-to-place/specialty market access"]},"block-appt":{tag:"Blocked · Appointment",c:"#501c0c",title:"Not appointed with carrier",desc:"Agency does not have an active direct appointment for this carrier through AmSuisse.",items:["Recovery option 1: Request Carrier Appointment — launches eligibility check, only missing items surfaced","Recovery option 2: carrier may be available through AmSuisse Brokerage market library","If appointment declined: specific reason shown with alternative carrier suggestions from Appetite Guide"]},"block-pkg":{tag:"Blocked · Package",c:"#501c0c",title:"Incomplete brokerage package",desc:"Brokerage submission package missing required documents or fields.",items:["Package completeness % shown with specifically named missing items","Recovery: upload each named item directly from the package builder screen","Submit button unlocks automatically once minimum required package is complete"]},"block-api":{tag:"Blocked · API/Portal",c:"#501c0c",title:"API / portal error",desc:"Carrier API failed or portal session could not be established.",items:["API Error: show field/eligibility issue causing failure — not just an error code","Recovery options: Retry API Call, View Field Issue, Open Portal Workspace if available, Escalate to AmSuisse Brokerage","Portal session failed: Agency Admin → Integrations → Portal Credentials to refresh"]},"block-compliance":{tag:"Blocked · Compliance",c:"#501c0c",title:"Compliance block",desc:"A compliance item is preventing the agent from proceeding.",items:["W-9 missing or expired: upload in Agency Admin → Documents","ACH/payment info missing: add in Agency Admin → Settings","Background question not completed: finish in Agency Admin → Agency Profile","License suspended: contact Agency Admin — cannot be self-resolved through the system","Compliance snapshot on Home dashboard shows all pending items with due dates"]},};
const T={id:'root',c:'n-root',label:'iConnekt',sub:'Agent Journey · AmSuisse · 2026',kids:[{id:'onboarding',c:'c1',label:'Onboarding & setup',sub:'Phase 1',kids:[{id:'login',label:'Login / SSO',sub:'MFA · agency select · roles'},{id:'onboard',label:'Agency onboarding',sub:'Profile · E&O · licenses · docs'},{id:'home',label:'Home dashboard',sub:'Quotes · alerts · compliance · commissions'},{id:'admin',label:'Agency Admin',sub:'Users · roles · integrations · settings'},{id:'roles',label:'Roles & permissions',sub:'9 roles · data scopes · parent/child'},{id:'parent-child',label:'Parent/child agencies',sub:'Inheritance · data scopes · access'},{id:'notifications',label:'Notifications & tasks',sub:'Alerts · tasks · universal search'},]},{id:'appointments',c:'c2',label:'Carrier appointments',sub:'Phase 2',kids:[{id:'carrier-appts',label:'My direct appointments',sub:'~45 carriers · API or Portal badge'},{id:'appt-request',label:'Request appointment',sub:'Eligibility check · missing items only'},{id:'appt-status',label:'Appointment status',sub:'Full lifecycle · timeline · next action'},{id:'brokerage-mkt',label:'Brokerage market library',sub:'~45 markets · E&S · specialty · coastal'},{id:'appetite-guide',label:'Appetite guide',sub:'Search by product · state · class · carrier'},]},{id:'quoting',c:'c3',label:'Quote & Place',sub:'Phases 3–5 · one intake · three lanes',kids:[{id:'start-quote',label:'Start quote',sub:'Routing data · account basics · product specifics'},{id:'intake',label:'Common intake',sub:'Enter once · universal question bank'},{id:'market-match',label:'Market Match ✦',sub:'Routes to best path · blocked with specific reasons'},{id:'quote-strategy',label:'Quote strategy',sub:'Direct First / Brokerage If Needed (default)'},{id:'api-lane',label:'Direct API quote',sub:'Instant · API-connected carriers'},{id:'api-error',label:'API decline or error',sub:'Specific reason + retry/portal/brokerage options'},{id:'portal-lane',label:'Portal workspace',sub:'Appointed non-API carriers · stay in iConnekt'},{id:'portal-upload',label:'Upload & save portal quote',sub:'Capture result · add to comparison'},{id:'broker-lane',label:'AmSuisse brokerage',sub:'Direct-first · brokerage when needed'},{id:'pkg-build',label:'Build brokerage package',sub:'ACORDs · named missing items · completeness %'},{id:'broker-submit',label:'Submit to brokerage',sub:'Capacity controls · turnaround shown'},{id:'compare',label:'Quote comparison',sub:'All sources · one table · source labels'},{id:'escalate',label:'Escalate to brokerage',sub:'After direct attempts · full context packaged'},{id:'bind',label:'Request bind',sub:'API · portal · brokerage bind paths'},]},{id:'postbind',c:'c4',label:'Post-bind & book of business',sub:'Phase 6',kids:[{id:'accounts-policies',label:'Accounts & policies',sub:'Book of business · renewals · endorsements'},{id:'commissions',label:'Commission tracking',sub:'Estimated → paid · discrepancies · production'},{id:'renewal',label:'Renewal queue',sub:'90/60/30-day · remarket · retained/lost'},{id:'epic-sf',label:'EPIC / Salesforce sync',sub:'Phase 2 · policy + activity + production'},]},{id:'brokerage',c:'c5',label:'Brokerage desk',sub:'Internal · AmSuisse staff only',kids:[{id:'broker-queue',label:'Submissions queue',sub:'New · assigned · out to market · returned'},{id:'broker-assign',label:'Assign broker',sub:'Case ownership · agent notification'},{id:'broker-market',label:'Send to market',sub:'Market selection · responses · indications'},{id:'broker-info',label:'More info needed',sub:'Agent task created · response tracked'},{id:'broker-return',label:'Return quote to agent',sub:'Comparison table · AmSuisse Brokerage label'},{id:'broker-bind',label:'Brokerage bind',sub:'Broker handles · policy record · commissions'},]},{id:'blocked',c:'c6',label:'Blocked paths & recovery',sub:'Every block shows reason + recovery action',kids:[{id:'block-eo',label:'E&O expired or missing',sub:'Upload certificate → auto-unblocks'},{id:'block-license',label:'Missing license',sub:'Add in Agency Admin → unblocks'},{id:'block-appetite',label:'Outside carrier appetite',sub:'Appetite Guide or Submit to Brokerage'},{id:'block-appt',label:'Not appointed',sub:'Request appointment or use brokerage'},{id:'block-pkg',label:'Incomplete package',sub:'Named missing items · upload to unblock'},{id:'block-api',label:'API / portal error',sub:'Retry · field issue · portal · brokerage'},{id:'block-compliance',label:'Compliance block',sub:'W-9 · ACH · background · license suspended'},]},]};
const RX=60,L1X=340,L2X=620,L1_BASE=58,CHILD_SP=60,CHILD_PAD=60,FADE_DUR=160;
const exp={},nEl={},lEl={},visL={};
const world=document.getElementById('w'),svg=document.getElementById('s');
let tx=0,ty=0,sc=1,dr=false,lx=0,ly=0,dd=false,pp=null;
function aT(){world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;const p=document.getElementById('zpct');if(p)p.textContent=Math.round(sc*100)+'%';}
const cv=document.getElementById('cv');
cv.addEventListener('mousedown',e=>{if(e.target.closest('.n')||e.target.closest('.pop'))return;dr=true;dd=false;lx=e.clientX;ly=e.clientY});
window.addEventListener('mousemove',e=>{if(!dr)return;const dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)+Math.abs(dy)>3)dd=true;tx+=dx;ty+=dy;lx=e.clientX;ly=e.clientY;aT()});
window.addEventListener('mouseup',()=>dr=false);
cv.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?.9:1.1,r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;tx=mx-(mx-tx)*d;ty=my-(my-ty)*d;sc*=d;aT()},{passive:false});
let lt=0,ll=0;
cv.addEventListener('touchstart',e=>{lt=e.touches[0].clientX;ll=e.touches[0].clientY;dd=false});
cv.addEventListener('touchmove',e=>{e.preventDefault();tx+=e.touches[0].clientX-lt;ty+=e.touches[0].clientY-ll;lt=e.touches[0].clientX;ll=e.touches[0].clientY;dd=true;aT()},{passive:false});
function zm(f){const r=cv.getBoundingClientRect(),mx=r.width/2,my=r.height/2;tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;sc*=f;aT()}
function branchH(k){if(exp[k.id]&&k.kids&&k.kids.length)return Math.max(L1_BASE,k.kids.length*CHILD_SP+CHILD_PAD*2);return L1_BASE;}
function computeYs(){const Y={};let c=0;T.kids.forEach(k=>{const h=branchH(k);Y[k.id]=c+h/2;if(exp[k.id]&&k.kids){const s=Y[k.id]-(k.kids.length-1)*CHILD_SP/2;k.kids.forEach((gc,i)=>{Y[gc.id]=s+i*CHILD_SP})}c+=h});const ys=T.kids.map(k=>Y[k.id]);Y['root']=(ys[0]+ys[ys.length-1])/2;return Y;}
function drawLines(Y){const ry=Y['root'];T.kids.forEach(k=>{const ky=Y[k.id],p=lEl['r-'+k.id];if(p){const mx=(RX+200+L1X)/2;p.setAttribute('d',`M${RX+200},${ry} C${mx},${ry} ${mx},${ky} ${L1X},${ky}`)}if(k.kids&&exp[k.id]){k.kids.forEach(gc=>{const gy=Y[gc.id],p2=lEl[k.id+'-'+gc.id];if(p2){const mx2=(L1X+165+L2X)/2;p2.setAttribute('d',`M${L1X+165},${ky} C${mx2},${ky} ${mx2},${gy} ${L2X},${gy}`)}})}});}
function recenter(Y,fid){const vw=cv.clientWidth,vh=cv.clientHeight,fy=fid&&Y[fid]!==undefined?Y[fid]:Y['root'],tTx=vw*0.32-RX,tTy=vh/2-fy,sTx=tx,sTy=ty,dur=380,t0=performance.now();(function s(now){const t=Math.min(1,(now-t0)/dur),e2=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;tx=sTx+(tTx-sTx)*e2;ty=sTy+(tTy-sTy)*e2;aT();if(t<1)requestAnimationFrame(s)})(t0);}
function applyYs(Y,dc,fid){Object.keys(Y).forEach(id=>{if(nEl[id])nEl[id].style.top=Y[id]+'px'});drawLines(Y);setTimeout(()=>drawLines(Y),50);setTimeout(()=>drawLines(Y),420);if(dc)recenter(Y,fid);}
function setLine(k,show){lEl[k].style.opacity=show?'1':'0';visL[k]=show;}
function animateReflow(cb){Object.values(nEl).forEach(el=>{el.style.opacity='0.07'});Object.values(lEl).forEach(p=>{p.style.opacity='0.04'});setTimeout(()=>{cb();setTimeout(()=>{Object.values(nEl).forEach(el=>{el.style.opacity=el.classList.contains('vis')?'1':'0'});Object.keys(lEl).forEach(k=>{lEl[k].style.opacity=visL[k]===true?'1':'0'})},40)},FADE_DUR);}
const lineColors={c1:'rgba(90,160,100,0.35)',c2:'rgba(70,140,170,0.35)',c3:'rgba(180,148,70,0.35)',c4:'rgba(140,100,180,0.35)',c5:'rgba(160,100,60,0.35)',c6:'rgba(80,110,160,0.35)'};
function mk(node,cc){const d=document.createElement('div');d.className='n '+(cc||node.c||'');d.id='nd-'+node.id;const hk=node.kids&&node.kids.length;let h=`<div class="nl">${node.label}`;if(hk)h+=`<span class="ch"> ›</span>`;h+=`</div>`;if(node.sub)h+=`<div class="ns">${node.sub}</div>`;d.innerHTML=h;d.addEventListener('click',e=>{e.stopPropagation();onC(node,d)});world.appendChild(d);nEl[node.id]=d;return d;}
function pl(el,x,y){el.style.left=x+'px';el.style.top=y+'px'}
function mkL(key,col){if(lEl[key])return;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('fill','none');p.setAttribute('stroke-width','0.7');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke',col||'rgba(0,0,0,0.12)');p.style.transition='opacity .3s';p.style.opacity='0';visL[key]=false;svg.appendChild(p);lEl[key]=p;}
function build(){mk(T);T.kids.forEach(k=>{mk(k);mkL('r-'+k.id,lineColors[k.c]||'rgba(0,0,0,0.12)');if(k.kids){k.kids.forEach(gc=>{mk(gc,k.c);mkL(k.id+'-'+gc.id,lineColors[k.c]||'rgba(0,0,0,0.12)')})}});const Y=computeYs();pl(nEl['root'],RX,Y['root']);nEl['root'].classList.add('vis');T.kids.forEach(k=>{pl(nEl[k.id],L1X,Y[k.id]);nEl[k.id].classList.add('hid');if(k.kids)k.kids.forEach(gc=>{pl(nEl[gc.id],L2X,Y[gc.id]);nEl[gc.id].classList.add('hid')})});drawLines(Y);}
function rv(){const Y=computeYs(),vw=cv.clientWidth,vh=cv.clientHeight;tx=vw*0.32-RX;ty=vh/2-Y['root'];sc=1;aT();}
function onC(node,el){if(pp&&pp.dataset.for===node.id){closePop();return}const hk=node.kids&&node.kids.length;if(node.id==='root'){closePop();const any=T.kids.some(k=>nEl[k.id].classList.contains('vis'));animateReflow(()=>{T.kids.forEach(k=>{if(any){nEl[k.id].classList.replace('vis','hid');setLine('r-'+k.id,false);if(k.kids)k.kids.forEach(gc=>{nEl[gc.id].classList.replace('vis','hid');if(lEl[k.id+'-'+gc.id])setLine(k.id+'-'+gc.id,false)});exp[k.id]=false;nEl[k.id].classList.remove('op')}else{nEl[k.id].classList.replace('hid','vis');setLine('r-'+k.id,true)}});applyYs(computeYs(),true)});return;}if(hk){closePop();animateReflow(()=>{exp[node.id]=!exp[node.id];nEl[node.id].classList.toggle('op',exp[node.id]);if(exp[node.id]){const Y=computeYs();applyYs(Y,true,node.id);node.kids.forEach(gc=>{nEl[gc.id].classList.replace('hid','vis');if(lEl[node.id+'-'+gc.id])setLine(node.id+'-'+gc.id,true)})}else{node.kids.forEach(gc=>{nEl[gc.id].classList.replace('vis','hid');if(lEl[node.id+'-'+gc.id])setLine(node.id+'-'+gc.id,false)});const idx=T.kids.findIndex(k=>k.id===node.id);applyYs(computeYs(),true,idx>0?T.kids[idx-1].id:'root')}});return;}showPop(node.id,el);}
function showPop(id,nodeEl){closePop();const d=INFO[id];if(!d)return;const p=document.createElement('div');p.className='pop';p.dataset.for=id;let h=`<button class="px" onclick="closePop()">✕</button>`;h+=`<div class="ptg" style="color:${d.c}">${d.tag}</div>`;h+=`<div class="ptt">${d.title}</div>`;h+=`<div class="pdc">${d.desc}</div>`;if(d.items&&d.items.length){h+=`<ul class="pli">`;d.items.forEach(it=>{h+=`<li>${it}</li>`});h+=`</ul>`}p.innerHTML=h;world.appendChild(p);pp=p;p.style.left=(L2X+240)+'px';p.style.top=Math.max(20,(parseFloat(nodeEl.style.top)-80))+'px';requestAnimationFrame(()=>p.classList.add('on'));}
function closePop(){if(pp){pp.remove();pp=null}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
cv.addEventListener('click',e=>{if(!e.target.closest('.n')&&!e.target.closest('.pop')&&!dd)closePop()});
build();rv();
</script>
